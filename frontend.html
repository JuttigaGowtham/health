<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSense AI - Medical Report Simplifier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Using a stable version of PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #4f46e5;
            animation: spin 1s ease infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body class="bg-gradient-to-br from-indigo-50 via-white to-blue-50 min-h-screen flex flex-col items-center p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-4xl sm:text-5xl font-extrabold text-indigo-700 drop-shadow-md">🩺 MediSense AI</h1>
            <p class="text-gray-600 mt-2 text-lg">Your Personal AI Health Report Companion</p>
        </header>

        <main class="w-full bg-white p-6 sm:p-8 rounded-2xl shadow-xl border border-gray-200">
            <div id="message-box" class="hidden p-4 mb-4 rounded-lg"></div>

            <div class="mb-6">
                <label for="reportText" class="block font-semibold mb-2 text-gray-800">📄 Paste Report Text</label>
                <textarea id="reportText" class="w-full border border-gray-300 rounded-lg p-3 h-40 focus:ring-2 focus:ring-indigo-500 outline-none transition-shadow" placeholder="Paste your medical report text here..."></textarea>
            </div>

            <div class="mb-6">
                <label for="reportFile" class="block font-semibold mb-2 text-gray-800">📂 Or Upload Report (PDF/TXT)</label>
                <input type="file" id="reportFile" accept=".pdf,.txt" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200 transition-colors"/>
            </div>

            <button id="analyzeBtn" class="w-full bg-indigo-600 text-white py-3 rounded-lg text-lg font-semibold hover:bg-indigo-700 transition-all duration-300 shadow-md focus:outline-none focus:ring-4 focus:ring-indigo-300 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-zap"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                Simplify & Analyze Report
            </button>
        </main>

        <section id="results" class="mt-10 w-full"></section>

        <footer class="mt-12 text-gray-500 text-sm text-center">
            <p>Disclaimer: MediSense AI provides a simplified summary and is not a substitute for professional medical advice. Always consult with your doctor.</p>
        </footer>
    </div>

<script>
// Leave the API key as an empty string. The environment will provide it.
const apiKey = "";

// Set up PDF.js worker
if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

const analyzeBtn = document.getElementById("analyzeBtn");
const resultsDiv = document.getElementById("results");
const reportTextEl = document.getElementById("reportText");
const reportFileEl = document.getElementById("reportFile");
const messageBox = document.getElementById("message-box");

function showMessage(message, type = 'error') {
    messageBox.textContent = message;
    messageBox.className = `p-4 mb-4 rounded-lg ${type === 'error' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}`;
    messageBox.classList.remove('hidden');
}

function hideMessage() {
    messageBox.classList.add('hidden');
}

async function readPDF(file) {
    try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let text = "";
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            // Use item.str to get text content
            text += content.items.map(item => item.str).join(" ") + "\n";
        }
        return text;
    } catch (error) {
        console.error("Error reading PDF:", error);
        showMessage("Failed to read the PDF file. It might be corrupted or protected.");
        return null;
    }
}

analyzeBtn.addEventListener("click", async () => {
    hideMessage();
    resultsDiv.innerHTML = "";
    
    const reportText = reportTextEl.value.trim();
    const file = reportFileEl.files[0];

    if (!reportText && !file) {
        showMessage("Please paste your report text or upload a file.");
        return;
    }

    resultsDiv.innerHTML = `
        <div class="flex flex-col items-center justify-center p-8 bg-white rounded-2xl shadow-lg border border-gray-100">
            <div class="spinner"></div>
            <p class="text-gray-600 mt-4 animate-pulse">Your report is being analyzed by MediSense AI. Please wait...</p>
        </div>`;
    analyzeBtn.disabled = true;
    analyzeBtn.classList.add('opacity-50', 'cursor-not-allowed');

    try {
        let reportContent = reportText;
        if (file) {
            if (file.type === "text/plain") {
                reportContent = await file.text();
            } else if (file.type === "application/pdf") {
                reportContent = await readPDF(file);
                if (reportContent === null) throw new Error("PDF read failed");
            } else {
                throw new Error("Unsupported file type. Please upload a PDF or TXT file.");
            }
        }

        const systemPrompt = `You are a medical expert AI, MediSense. Your task is to analyze a medical report and provide a simplified, easy-to-understand summary for a patient.
        
        Follow these instructions precisely:
        1.  First, provide a "General Summary" of the report in a friendly, clear, and concise paragraph.
        2.  Next, provide "Health Suggestions & Precautions" based on the report's findings, formatted as a bulleted list.
        3.  Finally, extract key test results into a JSON object. The JSON should be enclosed in a markdown code block (\`\`\`json ... \`\`\`).
        4.  For each test result in the JSON, include:
            - test_name: The name of the test (e.g., "Hemoglobin").
            - value: The measured value.
            - unit: The unit of measurement (e.g., "g/dL").
            - normal_range: The normal range for the test.
            - explanation: A simple, one-sentence explanation of what the result means.
            - risk_level: A single word indicating the risk: "Normal", "Borderline", or "High".
        
        Do not include any information or text after the JSON block.`;

        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        const payload = {
            contents: [{
                parts: [{ text: `Medical Report:\n${reportContent}` }]
            }],
            systemInstruction: {
                parts: [{ text: systemPrompt }]
            },
        };

        const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!response.ok) {
            const errorBody = await response.text();
            console.error("API Error Response:", errorBody);
            throw new Error(`API request failed with status ${response.status}. Check the console for details.`);
        }

        const result = await response.json();
        const textOutput = result.candidates?.[0]?.content?.parts?.[0]?.text || "";

        if (!textOutput) {
            throw new Error("Received an empty response from the AI. The report might be unreadable.");
        }
        
        renderResults(textOutput);

    } catch (err) {
        console.error(err);
        resultsDiv.innerHTML = "";
        showMessage(`An error occurred: ${err.message}`);
    } finally {
        analyzeBtn.disabled = false;
        analyzeBtn.classList.remove('opacity-50', 'cursor-not-allowed');
    }
});

function renderResults(textOutput) {
    const jsonRegex = /```json\s*([\s\S]*?)\s*```/;
    const jsonMatch = textOutput.match(jsonRegex);
    const summaryText = textOutput.replace(jsonRegex, "").trim();

    let data;
    if (jsonMatch && jsonMatch[1]) {
        try {
            data = JSON.parse(jsonMatch[1]);
        } catch (e) {
            console.error("Error parsing JSON from Gemini output:", jsonMatch[1]);
            showMessage("Could not parse the structured data from the AI response. Displaying summary only.");
        }
    } else {
         console.warn("No valid JSON block found in the response.");
    }
    
    resultsDiv.innerHTML = "";

    // Render Summary and Suggestions
    if (summaryText) {
        const summaryDiv = document.createElement("div");
        summaryDiv.className = "p-6 bg-white rounded-2xl shadow-lg border border-gray-100 mb-8";
        
        let formattedSummary = summaryText
            .replace(/General Summary/gi, '<h2 class="text-2xl font-bold text-indigo-800 mb-3">General Summary</h2>')
            .replace(/Health Suggestions & Precautions/gi, '<h2 class="text-2xl font-bold text-indigo-800 mt-6 mb-3">Health Suggestions & Precautions</h2>')
            .replace(/\* (.*?)(?=\n\*|\n$)/g, '<li class="mb-2 ml-5 list-disc">$1</li>');

        summaryDiv.innerHTML = formattedSummary;
        resultsDiv.appendChild(summaryDiv);
    }

    // Render Test Results
    if (data && Array.isArray(data) && data.length > 0) {
        const resultsTitle = document.createElement('h2');
        resultsTitle.className = "text-2xl font-bold text-indigo-800 mb-4";
        resultsTitle.textContent = "Detailed Test Results";
        resultsDiv.appendChild(resultsTitle);

        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-1 md:grid-cols-2 gap-4';

        for (const item of data) {
            const risk = (item.risk_level || "normal").toLowerCase();
            const colorMap = {
                normal: "border-green-500 bg-green-50",
                borderline: "border-yellow-500 bg-yellow-50",
                high: "border-red-500 bg-red-50"
            };
            const emojiMap = { normal: "✅", borderline: "⚠️", high: "❗" };

            const colorClass = colorMap[risk] || "border-gray-400 bg-gray-50";
            const emoji = emojiMap[risk] || "⚪";

            const card = document.createElement("div");
            card.className = `border-l-4 ${colorClass} p-4 rounded-lg shadow-sm transition-transform hover:scale-105`;
            card.innerHTML = `
                <h3 class="text-lg font-bold text-gray-800 mb-2">${emoji} ${item.test_name}</h3>
                <div class="space-y-1 text-sm text-gray-700">
                    <p><strong>Value:</strong> <span class="font-semibold text-black">${item.value ?? "N/A"} ${item.unit ?? ""}</span></p>
                    ${item.normal_range ? `<p><strong>Normal Range:</strong> ${item.normal_range}</p>` : ""}
                    <p class="pt-1"><strong>Status:</strong> ${item.explanation || "No explanation provided."}</p>
                </div>
            `;
            grid.appendChild(card);
        }
        resultsDiv.appendChild(grid);

    } else if (jsonMatch) {
         showMessage("Structured test results could not be displayed, but a summary is available above.", "info");
    } else if (summaryText.length === 0) {
        resultsDiv.innerHTML = `<div class="p-8 text-center bg-white rounded-2xl shadow-lg border border-gray-100"><p class="text-gray-600">No recognizable data found. The AI could not process this report. Please check the report's content and try again.</p></div>`;
    }
}
</script>
</body>
</html>
